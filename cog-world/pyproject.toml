[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cog-world"
version = "0.1.0"
description = "M26 世界环境模块：食物、危险、地形、资源"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "cog-body>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
