[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cog-logger"
version = "0.1.0"
description = "M02 日志模块：结构化日志、指标记录、实验追踪"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
tb = ["tensorboard>=2.14"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
